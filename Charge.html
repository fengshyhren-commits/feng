<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文課費用計算平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-indigo-600 p-6 text-white">
            <h1 class="text-2xl font-bold">英文課費用計算平台</h1>
            <p class="text-indigo-100 mt-1">每堂 900 元，依出席人數平分</p>
        </div>

        <div class="p-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="feeTable">
                    <thead>
                        <tr class="text-gray-600 border-b">
                            <th class="p-3">小朋友姓名</th>
                            <th class="p-3 text-center">第 1 週</th>
                            <th class="p-3 text-center">第 2 週</th>
                            <th class="p-3 text-center">第 3 週</th>
                            <th class="p-3 text-center">第 4 週</th>
                            <th class="p-3 text-center font-bold text-indigo-700">總金額</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Table content injected via JS -->
                    </tbody>
                </table>
            </div>

            <div class="mt-8 p-4 bg-gray-100 rounded-xl">
                <h2 class="text-lg font-semibold mb-2">費用說明：</h2>
                <ul class="text-sm text-gray-600 space-y-1">
                    <li>• 每堂課程 $900 元。</li>
                    <li>• 若有人缺席，費用將由當天出席的小朋友均分。</li>
                    <li>• 請勾選每個小朋友每週的出席情況，系統將即時計算。</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const students = [
            { id: 0, name: '張城熏-Jason' },
            { id: 1, name: '劉藺雲-Brady' },
            { id: 2, name: '馮晨媛-QBE' },
            { id: 3, name: '林芷瑀-Zoe' },
            { id: 4, name: '林珈瑀-Dora' },
            { id: 5, name: '林于恩-Angel' }
        ];

        // 4 weeks, each week is an array of 6 booleans
        let attendance = [
            [true, true, true, true, true, true],
            [true, true, true, true, true, true],
            [true, true, true, true, true, true],
            [true, true, true, true, true, true]
        ];

        function calculate() {
            const totals = new Array(students.length).fill(0);
            
            // Loop through each week
            for (let week = 0; week < 4; week++) {
                const attendees = attendance[week].filter(Boolean).length;
                if (attendees > 0) {
                    const costPerPerson = 900 / attendees;
                    // Distribute cost
                    for (let s = 0; s < students.length; s++) {
                        if (attendance[week][s]) {
                            totals[s] += costPerPerson;
                        }
                    }
                }
            }
            return totals;
        }

        function renderTable() {
            const totals = calculate();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            students.forEach((student, sIdx) => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';
                
                let html = `<td class="p-4 font-medium text-gray-800">${student.name}</td>`;
                
                // Checkboxes for weeks
                for (let w = 0; w < 4; w++) {
                    html += `<td class="p-4 text-center">
                        <input type="checkbox" 
                               ${attendance[w][sIdx] ? 'checked' : ''} 
                               onchange="toggleAttendance(${w}, ${sIdx})"
                               class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                    </td>`;
                }
                
                html += `<td class="p-4 text-center font-bold text-indigo-600">
                            ${Math.round(totals[sIdx])} 元
                        </td>`;
                
                row.innerHTML = html;
                tbody.appendChild(row);
            });
        }

        function toggleAttendance(week, studentIdx) {
            attendance[week][studentIdx] = !attendance[week][studentIdx];
            renderTable();
        }

        // Initialize
        renderTable();
    </script>
</body>
</html>
